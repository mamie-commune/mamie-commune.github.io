# Copie les films de la release GitHub « film » vers l'hébergement IONOS (dossier films/),
# où ils sont servis comme de vraies vidéos, lisibles sur téléphone.
# Pas « videos/ » : ce nom est déjà celui de la page Vidéos (/videos), le serveur ouvrirait le dossier à la place.
# À lancer à la main après avoir ajouté un film à la release : onglet Actions → « Envoyer les films sur IONOS » → Run workflow,
# ou : gh workflow run film-ionos.yml
name: Envoyer les films sur IONOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos
  cancel-in-progress: false

jobs:
  films:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les films de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir videos
          gh release download film -R "$GITHUB_REPOSITORY" -p "*.mp4" -D videos
          ls -lh videos
      - name: Envoyer sur IONOS (SFTP)
        env:
          HOTE: ${{ secrets.IONOS_HOTE }}
          UTILISATEUR: ${{ secrets.IONOS_UTILISATEUR }}
          LFTP_PASSWORD: ${{ secrets.IONOS_MOT_DE_PASSE }}
          DOSSIER: ${{ vars.IONOS_DOSSIER || '/mamiecommune' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          # Seuls les fichiers nouveaux ou de taille différente partent.
          lftp --env-password -u "$UTILISATEUR" "sftp://$HOTE" -e "
            set sftp:auto-confirm yes; set net:max-retries 5; set net:timeout 60;
            mv $DOSSIER/videos $DOSSIER/films || echo pas-de-dossier-videos-a-renommer;
            mkdir -p -f $DOSSIER/films;
            mirror -R --ignore-time --verbose=1 videos/ $DOSSIER/films;
            bye"
