# Toutes les 3 heures : ajoute les nouvelles publications TikTok de @mamie_commune à data/videos.js
# (API officielle de TikTok, secrets TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET, TIKTOK_REFRESH_TOKEN)
# et met à jour les vues. Si quelque chose a changé, enregistre et relance « Publier le site ».
# À la main (onglet Actions → « Ajouter les TikTok de Mamie » → Run workflow) : coller l'adresse d'un TikTok
# pour l'ajouter tout de suite, même sans les clés de l'API.
name: Ajouter les TikTok de Mamie

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      adresse:
        description: "Adresse d'un TikTok à ajouter (laisser vide pour tout relever)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  tiktok:
    runs-on: ubuntu-latest
    env:
      HAS_ROBOT: ${{ secrets.MAMIE_ROBOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Relever les publications
        id: releve
        shell: pwsh
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          ADRESSE: ${{ github.event.inputs.adresse }}
        run: ./_src/tiktok.ps1 -Adresse "$env:ADRESSE"
      - name: Garder le nouveau jeton TikTok
        # Seulement si un jeton personnel MAMIE_ROBOT_TOKEN (droit « secrets » sur ce dépôt) est fourni.
        if: steps.releve.outputs.nouveau_jeton != '' && env.HAS_ROBOT == 'true'
        env:
          GH_TOKEN: ${{ secrets.MAMIE_ROBOT_TOKEN }}
          JETON: ${{ steps.releve.outputs.nouveau_jeton }}
        run: gh secret set TIKTOK_REFRESH_TOKEN --body "$JETON" --repo "$GITHUB_REPOSITORY"
      - name: Enregistrer et publier si ça a changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/videos.js; then
            echo "Rien de nouveau sur TikTok."
            exit 0
          fi
          git config user.name "mamie-commune-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.js
          git commit -m "TikTok : nouvelles publications et vues, mise à jour automatique"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
          gh workflow run publier.yml --ref main
