# Une fois par an : échange le code donné par la page https://mamiecommune.org/tiktok-retour
# contre l'autorisation durable (« refresh token »), et l'enregistre dans le secret TIKTOK_REFRESH_TOKEN.
# Besoin des secrets TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET et MAMIE_ROBOT_TOKEN (jeton GitHub, droit « Secrets »).
# Rien n'est jamais affiché dans le journal.
name: Connecter TikTok

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code copié sur la page mamiecommune.org/tiktok-retour"
        required: true

permissions:
  contents: read
  actions: write

jobs:
  connexion:
    runs-on: ubuntu-latest
    steps:
      - name: Échanger le code et enregistrer l'autorisation
        env:
          CODE: ${{ github.event.inputs.code }}
          CLE: ${{ secrets.TIKTOK_CLIENT_KEY }}
          SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.MAMIE_ROBOT_TOKEN }}
        run: |
          set -euo pipefail
          for v in CLE SECRET GH_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Secret manquant : TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET ou MAMIE_ROBOT_TOKEN."; exit 1; fi
          done
          echo "::add-mask::$CODE"
          rep=$(curl -sS -X POST https://open.tiktokapis.com/v2/oauth/token/ \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_key=$CLE" --data-urlencode "client_secret=$SECRET" \
            --data-urlencode "code=$CODE" --data-urlencode "grant_type=authorization_code" \
            --data-urlencode "redirect_uri=https://mamiecommune.org/tiktok-retour")
          jeton=$(echo "$rep" | jq -r '.refresh_token // empty')
          if [ -z "$jeton" ]; then
            echo "::error::TikTok a refusé : $(echo "$rep" | jq -r '.error_description // .error // "réponse inattendue"'). Le code a peut-être expiré : recommence depuis la page tiktok-retour."
            exit 1
          fi
          echo "::add-mask::$jeton"
          echo "Compte autorisé, avec les droits : $(echo "$rep" | jq -r '.scope')"
          gh secret set TIKTOK_REFRESH_TOKEN --body "$jeton" --repo "$GITHUB_REPOSITORY"
      - name: Relever les TikTok tout de suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tiktok.yml --ref main --repo "$GITHUB_REPOSITORY"
